# Ryoku session environment, read by the systemd user manager at login.
#
# Hyprland sets these from ryoku/hyprland/modules/env.lua, which only reaches a
# Hyprland session. niri inherits nothing of the sort, so on niri every spawn
# from a keybind or the compositor's own autostart ran without them: the
# keybind cheatsheet, the welcome tour and the first-boot hint died on
# `module "Ryoku.Ui.Singletons" is not installed` (a checkout keeps that module
# in ~/.local, not /usr/lib, and only ryoku-shell's daemon injects the path into
# the configs it supervises), the polkit agent never registered, plain Qt apps
# lost their palette and icons, and PATH did not carry the checkout's binaries.
#
# environment.d is read by the user manager, so niri and everything it spawns
# get these on either compositor; compositor-specific values (ABI hints for
# Hyprland's backend, HYPRCURSOR_*) stay in env.lua.
#
# $HOME expands here, so one file serves every user on both channels.

XCURSOR_THEME=Bibata-Modern-Ice
XCURSOR_SIZE=24

# Shared QML modules (Ryoku.Ui, Ryoku.PluginKit, Ryoku.Blobs): /usr/lib/qt6/qml
# on a package install, ~/.local/lib/qt6/qml from a deploy.sh checkout.
QML_IMPORT_PATH=$HOME/.local/lib/qt6/qml
QML2_IMPORT_PATH=$HOME/.local/lib/qt6/qml

# A checkout's ryoku-* binaries live in ~/.local/bin, ahead of the package's.
PATH=$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin

# qt6ct, not kde: the kde platform theme needs plasma-integration, which Ryoku
# does not ship, so it would strip plain Qt apps of their palette and font.
QT_QPA_PLATFORMTHEME=qt6ct

# Prefer native Wayland (fall back to X11) so GTK/Qt get the compositor's
# fractional scale instead of XWayland drawing them 1:1 at non-integer scales.
GDK_BACKEND=wayland,x11,*
QT_QPA_PLATFORM=wayland;xcb
QT_AUTO_SCREEN_SCALE_FACTOR=1
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
ELECTRON_OZONE_PLATFORM_HINT=auto

# GTK4's default renderer reaches the display through org.gnome.Mutter's
# ServiceChannel, which only exists under Mutter, so GTK4 apps hang at startup
# on a wlroots compositor. Pin the direct Wayland path.
GSK_RENDERER=gl

# The shell daemon registers as the PolicyKit1 authentication agent when it
# reads this at startup, so administrator prompts use a Ryoku island rather
# than the stock agent's grey dialog.
RYOKU_POLKIT_AGENT=1

EDITOR=nvim
VISUAL=nvim